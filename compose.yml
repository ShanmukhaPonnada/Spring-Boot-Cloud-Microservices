services:
  user-service:
    image: ghcr.io/goal651/springboot_microservice/user-service:latest
    restart: always
    deploy:
      replicas: 2
    depends_on:
      eureka:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:{MANAGEMENT_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - micro-net
    mem_limit: 600m
    cpus: "1.0"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms256m -Xmx384m
    env_file: .env

  auth-service:
    image: ghcr.io/goal651/springboot_microservice/auth-service:latest
    restart: always
    deploy:
      replicas: 2
    depends_on:
      eureka:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${MANAGEMENT_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - micro-net
    mem_limit: 600m
    cpus: "1.0"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms256m -Xmx384m
    env_file: .env

  mail-service:
    image: ghcr.io/goal651/springboot_microservice/mail-service:latest
    restart: always
    deploy:
      replicas: 2
    depends_on:
      eureka:
        condition: service_healthy
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${MANAGEMENT_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - micro-net
    mem_limit: 600m
    cpus: "1.0"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms256m -Xmx384m
    env_file: .env

  eureka:
    image: ghcr.io/goal651/springboot_microservice/eureka:latest
    container_name: eureka
    restart: always
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - micro-net
    mem_limit: 700m
    cpus: "1.2"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms256m -Xmx512m

  config-server:
    image: ghcr.io/goal651/springboot_microservice/config-server:latest
    container_name: config-server
    restart: always
    ports:
      - "8888:8888"
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - micro-net
    mem_limit: 300m
    cpus: "0.6"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms128m -Xmx200m

  gateway:
    image: ghcr.io/goal651/springboot_microservice/gateway:latest
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      eureka:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${MANAGEMENT_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - micro-net
    mem_limit: 600m
    cpus: "1.0"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -Xms256m -Xmx384m

  db:
    image: postgres:15
    container_name: db
    restart: always
    ports:
      - "2500:5432"
    mem_limit: 800m
    cpus: "1.5"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - micro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
    mem_limit: 500m
    cpus: "0.6"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - micro-net
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q 'Mode: standalone'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    ports:
      - "19092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    mem_limit: 1.2g
    cpus: "2.0"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - micro-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - micro-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      
      interval: 10s
      timeout: 5s
      retries: 5
  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    command: [ "-config.file=/etc/loki/config.yml" ]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - micro-net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    restart: always
    command: [ "-config.file=/etc/promtail/config.yml" ]
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-data:/tmp
    networks:
      - micro-net

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      loki:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - micro-net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  micro-net:

volumes:
  postgres-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  redis-data:
  loki-data:
  promtail-data:
  grafana-data:
